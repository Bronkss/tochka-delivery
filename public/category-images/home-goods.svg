<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Товары для дома">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111827" flood-opacity=".14"/>
    </filter>
    <radialGradient id="shine" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
  <ellipse cx="320" cy="335" rx="170" ry="28" fill="#111827" opacity=".10"/>
  <g filter="url(#shadow)">
      <path d="M210 142 L314 92 L430 138 L326 194 Z" fill="#ffffff" opacity=".65"/>
      <path d="M210 142 L326 194 L326 334 L210 276 Z" fill="#cbd5e1"/>
      <path d="M326 194 L430 138 L430 278 L326 334 Z" fill="#cbd5e1" opacity=".72"/>
      <rect x="240" y="208" width="62" height="52" rx="14" fill="#ffffff" opacity=".85"/>
      <circle cx="270" cy="234" r="10" fill="#64748b"/>
    </g>
  <g filter="url(#softShadow)">
    <rect x="392" y="192" width="80" height="120" rx="18" fill="#38bdf8"/>
    <rect x="410" y="166" width="44" height="36" rx="10" fill="#0369a1"/>
