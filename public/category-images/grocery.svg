  </defs>
  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
  <ellipse cx="320" cy="333" rx="170" ry="28" fill="#111827" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="214" y="116" width="212" height="216" rx="36" fill="#f59e0b"/>
    <rect x="246" y="166" width="148" height="96" rx="26" fill="#fff7ed" opacity=".92"/>
    <circle cx="320" cy="214" r="26" fill="#d97706"/>
    <path d="M256 116 c16-50 112-50 128 0" stroke="#92400e" stroke-width="16" stroke-linecap="round" fill="none"/>
