<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Табачная продукция">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111827" flood-opacity=".14"/>
    </filter>
    <radialGradient id="shine" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
  <ellipse cx="320" cy="335" rx="180" ry="28" fill="#111827" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="214" y="128" width="190" height="210" rx="26" fill="#ffffff"/>
    <rect x="214" y="128" width="190" height="78" rx="26" fill="#ef4444"/>
    <rect x="248" y="232" width="122" height="54" rx="14" fill="#f1f5f9"/>
    <text x="309" y="269" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#475569">18+</text>
    <rect x="408" y="196" width="92" height="26" rx="13" fill="#f8fafc"/>
    <rect x="474" y="196" width="42" height="26" rx="13" fill="#d97706"/>
