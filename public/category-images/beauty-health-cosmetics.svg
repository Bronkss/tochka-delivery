<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Косметика и гигиена">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111827" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#111827" flood-opacity=".14"/>
    </filter>
    <radialGradient id="shine" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
  <ellipse cx="320" cy="334" rx="170" ry="28" fill="#111827" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="218" y="128" width="72" height="188" rx="24" fill="#db2777"/>
    <rect x="234" y="98" width="40" height="42" rx="12" fill="#9d174d"/>
    <rect x="336" y="152" width="100" height="158" rx="34" fill="#ffffff"/>
    <rect x="358" y="124" width="56" height="42" rx="14" fill="#64748b"/>
    <circle cx="386" cy="232" r="34" fill="#a7f3d0"/>
  </g>
</svg>