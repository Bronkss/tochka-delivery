    <radialGradient id="shine" cx="35%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
  <rect width="640" height="420" rx="46" fill="#111827"/>
  <circle cx="510" cy="92" r="132" fill="#a3e635" opacity=".16"/>
  <ellipse cx="320" cy="336" rx="160" ry="28" fill="#111827" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="244" y="84" width="152" height="250" rx="30" fill="#1f2937" stroke="#a3e635" stroke-width="8"/>
    <path d="M344 126 l-92 116 h66 l-26 74 104-128 h-70z" fill="#a3e635"/>
    <rect x="276" y="270" width="88" height="34" rx="14" fill="#f8fafc" opacity=".15"/>
