    <ellipse cx="248" cy="210" rx="60" ry="44" fill="#f59e0b"/>
    <ellipse cx="318" cy="190" rx="62" ry="48" fill="#fbbf24"/>
    <ellipse cx="388" cy="214" rx="62" ry="44" fill="#f59e0b"/>
    <path d="M230 206 c36-22 52-22 84 0 M300 184 c40-24 60-24 94 4 M366 212 c34-20 50-18 78 2" stroke="#fff7ed" stroke-width="10" stroke-linecap="round" opacity=".75"/>
