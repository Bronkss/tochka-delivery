  <rect width="640" height="420" rx="46" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="128" fill="url(#shine)" opacity=".7"/>
  <circle cx="100" cy="360" r="118" fill="#ffffff" opacity=".55"/>
  <path d="M0 330 C120 260 230 382 336 314 C440 248 505 292 640 244 L640 420 L0 420 Z" fill="#ffffff" opacity=".46"/>
  
